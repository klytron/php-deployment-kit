name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Tests & Plan Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, pdo, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan Static Analysis
        run: vendor/bin/phpstan analyse

      - name: Run PHPUnit Test Suite
        run: vendor/bin/phpunit --no-coverage

      - name: Verify CLI scaffolding & Plan Validation
        run: |
          bin/klytron --help
          bin/klytron version
          bin/klytron init ci-sample-app --template=laravel --force
          DEPLOY_HOST=ci.test.internal bin/klytron plan
